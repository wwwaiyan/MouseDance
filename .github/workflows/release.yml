name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Confirm tag matches app version
        run: |
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$APP_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $APP_VERSION" >&2
            exit 1
          fi

      - name: Build portable package
        run: ./package.sh

      - name: Verify application
        run: |
          codesign --verify --deep --strict MouseDance.app
          file MouseDance.app/Contents/MacOS/MouseDance | grep 'universal binary'
          unzip -t dist/MouseDance-macOS-portable.zip
          hdiutil verify dist/MouseDance-macOS.dmg

      - name: Create checksum
        run: |
          cd dist
          shasum -a 256 MouseDance-macOS-portable.zip > MouseDance-macOS-portable.zip.sha256
          shasum -a 256 MouseDance-macOS.dmg > MouseDance-macOS.dmg.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/MouseDance-macOS-portable.zip \
            dist/MouseDance-macOS-portable.zip.sha256 \
            dist/MouseDance-macOS.dmg \
            dist/MouseDance-macOS.dmg.sha256 \
            --title "MouseDance $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
